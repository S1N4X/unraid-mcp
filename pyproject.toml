[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unraid-mcp"
version = "0.1.0"
description = "MCP server for Unraid's official GraphQL API"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastmcp>=4,<5",
    "httpx>=0.28",
    "graphql-core>=3.2,<4",
]

[project.scripts]
unraid-mcp = "unraid_mcp.__main__:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/unraid_mcp"]

[tool.hatch.build.targets.sdist.force-include]
"src/unraid_mcp/schema/unraid-api-4.35.1.graphql" = "src/unraid_mcp/schema/unraid-api-4.35.1.graphql"
"src/unraid_mcp/schema/unraid-api-4.35.1.introspection.json" = "src/unraid_mcp/schema/unraid-api-4.35.1.introspection.json"

[tool.hatch.build.targets.wheel.force-include]
"src/unraid_mcp/schema/unraid-api-4.35.1.graphql" = "unraid_mcp/schema/unraid-api-4.35.1.graphql"
"src/unraid_mcp/schema/unraid-api-4.35.1.introspection.json" = "unraid_mcp/schema/unraid-api-4.35.1.introspection.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=unraid_mcp --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["unraid_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
